<h2>Pretest Histologi: Jaringan Epitel dan Jaringan Otot</h2>
<div id="app"></div>
</div>
<script>
const Q=[
{t:"C1-C2",s:"Membrana basalis sulit terlihat pada pewarnaan H.E., tetapi dapat diperagakan dengan...",o:["PAS dan impregnasi perak","Orcein-anilin blue","Giemsa","Ziehl-Neelsen","Perl's iron stain"],w:["Orcein-anilin blue dipakai untuk memperagakan serat elastin dan otot lurik, bukan membrana basalis.","Giemsa dipakai untuk parasit darah dan sel tertentu, bukan untuk membrana basalis.","Ziehl-Neelsen dipakai untuk bakteri tahan asam, bukan untuk membrana basalis.","Perl's iron stain dipakai untuk mendeteksi zat besi, bukan membrana basalis."],e:"Membrana basalis tidak tampak jelas pada H.E. dan dapat diperagakan dengan PAS atau impregnasi perak. Struktur ini terdiri atas lamina basalis, lamina fibroreticularis, dan substantia fundamentalis, serta bersifat permeabel sehingga nutrisi dari jaringan di bawahnya dapat mencapai epitel."},
{t:"C1-C2",s:"Ciri utama epitel simplex columnare adalah...",o:["Selapis, sel silindris, dan inti oval","Selapis, sel pipih, dan inti bulat","Selapis, sel kuboid, dan inti bulat sentral","Berlapis, permukaan kolumnar, dan inti berjenjang","Berlapis, permukaan pipih tanpa lapisan tanduk"],w:["Selapis sel pipih dengan inti bulat adalah ciri simplex squamosum, bukan columnare.","Selapis sel kuboid dengan inti bulat sentral adalah ciri simplex cuboideum.","Inti berjenjang pada berbagai ketinggian adalah ciri pseudostratificatum, bukan simplex columnare.","Berlapis dengan permukaan pipih tanpa lapisan tanduk adalah ciri stratificatum squamosum noncornificatum."],e:"Simplex columnare terdiri atas satu lapis sel silindris dengan inti oval. Contohnya intestinum tenue, dengan petunjuk identifikasi berupa permukaan villi yang dapat dijumpai brush border dan sel piala."},
{t:"C1-C2",s:"Contoh jaringan dengan epitel simplex cuboideum yang khas adalah...",o:["Glandula thyroidea","Intestinum tenue","Ductus epididymidis","Oesophagus","Vesica urinaria"],w:["Intestinum tenue memiliki epitel simplex columnare, bukan kuboid.","Ductus epididymidis memiliki epitel pseudostratificatum columnare.","Oesophagus memiliki epitel stratificatum squamosum noncornificatum.","Vesica urinaria memiliki epitel transitionale."],e:"Epitel simplex cuboideum ditemukan pada glandula thyroidea, dengan sel kuboid berinti bulat sentral. Petunjuk identifikasinya adalah dinding folikel yang mengelilingi koloid."},
{t:"C1-C2",s:"Epitel pseudostratificatum columnare tampak seperti berlapis karena...",o:["Inti sel berada pada ketinggian berbeda dan tidak semua sel mencapai permukaan bebas, meskipun semua sel menempel pada membrana basalis","Sel-selnya bertumpuk dalam beberapa lapis yang nyata","Sel-selnya dipisahkan oleh jaringan ikat longgar","Permukaannya dilapisi lapisan tanduk","Sel-selnya tidak menempel pada membrana basalis"],w:["Sel-sel yang bertumpuk dalam beberapa lapis nyata menggambarkan epitel stratificatum, bukan pseudostratificatum.","Jaringan ikat longgar bukan pemisah antar sel pada epitel ini.","Lapisan tanduk adalah ciri stratificatum squamosum cornificatum, bukan pseudostratificatum.","Semua sel pada pseudostratificatum tetap menempel pada membrana basalis."],e:"Pada pseudostratificatum columnare, semua sel menempel pada membrana basalis, tetapi inti berada pada ketinggian berbeda dan tidak semua sel mencapai permukaan bebas. Hal ini memberi kesan berlapis. Contohnya adalah epitel saluran napas atas yang juga bersilia."},
{t:"C1-C2",s:"Kelenjar endokrin melepaskan sekretnya dengan cara...",o:["Ke ruang ekstraseluler, lalu masuk ke pembuluh darah atau limfa","Melalui duktus excretorius ke permukaan tubuh","Langsung ke rongga alat tanpa duktus","Melalui pembuluh limfa ke permukaan kulit","Melalui pori-pori kulit"],w:["Pelepasan melalui duktus ke permukaan tubuh adalah ciri kelenjar eksokrin.","Pelepasan langsung ke rongga alat adalah ciri kelenjar eksokrin.","Pelepasan melalui limfa ke permukaan kulit tidak sesuai dengan mekanisme kelenjar endokrin.","Pelepasan melalui pori kulit bukan mekanisme kelenjar endokrin."],e:"Kelenjar endokrin melepaskan sekret, biasanya hormon, ke ruang ekstraseluler lalu masuk ke aliran darah atau limfa. Kelenjar eksokrin tetap mempertahankan hubungan dengan permukaan tubuh melalui duktus."},
{t:"C1-C2",s:"Mekanisme sekresi apokrin ditemukan pada...",o:["Kelenjar keringat apokrin, kelenjar mamae, dan prostat","Kelenjar sebasea kulit","Sel goblet pada epitel mukosa","Pankreas eksokrin","Kelenjar ludah parotis"],w:["Kelenjar sebasea menggunakan sekresi holokrin, yaitu seluruh sel hancur melepaskan sekret.","Sel goblet adalah kelenjar unisellular yang melepaskan mukus melalui merokrin, bukan apokrin.","Pankreas eksokrin menggunakan sekresi merokrin melalui eksositosis.","Kelenjar ludah parotis termasuk merokrin, bukan apokrin."],e:"Pada mekanisme apokrin, sebagian sitoplasma apikal sel hilang bersama sekret. Mekanisme ini ditemukan pada kelenjar keringat apokrin, kelenjar mamae, dan prostat."},
{t:"C1-C2",s:"Sel goblet merupakan contoh kelenjar unisellular yang mensekresi...",o:["Musin, glikoprotein yang berubah menjadi mukus setelah menyerap air","Hormon tiroid langsung ke aliran darah","Enzim pencernaan protein","Keringat asin","Sebum dari lapisan lemak kulit"],w:["Hormon tiroid dilepaskan oleh kelenjar tiroid, bukan oleh sel goblet.","Enzim pencernaan protein dihasilkan oleh sel asinar pankreas, bukan sel goblet.","Keringat dihasilkan oleh kelenjar keringat, bukan sel goblet.","Sebum dihasilkan oleh kelenjar sebasea secara holokrin, bukan sel goblet."],e:"Sel goblet adalah satu-satunya contoh kelenjar unisellular eksokrin pada mamalia. Sel ini mensekresi glikoprotein musin, yang setelah menyerap air menjadi mukus."},
{t:"C1-C2",s:"Mikrovili pada epitel usus halus berfungsi terutama untuk...",o:["Absorpsi, dengan memperluas permukaan sel hingga sekitar 20-30 kali","Pergerakan cairan secara searah","Sekresi hormon ke aliran darah","Adhesi antar sel secara mekanis","Penerimaan rangsangan sensorik"],w:["Pergerakan cairan secara searah adalah fungsi silia, bukan mikrovili.","Sekresi hormon ke aliran darah adalah fungsi kelenjar endokrin.","Adhesi mekanis dilakukan oleh zonula adherens dan desmosoma, bukan mikrovili.","Penerimaan rangsangan sensorik adalah fungsi stereosilia atau silia khusus pada sel sensorik, bukan mikrovili usus."],e:"Mikrovili adalah tonjolan sitoplasma sepanjang sekitar 1 µm dan lebar 0,1 µm yang memperluas permukaan sel untuk absorpsi. Pada usus halus, mikrovili padat membentuk brush border, dan luas permukaannya dapat meningkat sekitar 20-30 kali."},
{t:"C1-C2",s:"Gap junction berfungsi sebagai...",o:["Saluran komunikasi antar sel yang memungkinkan pertukaran molekul kecil (kurang dari 1,5 nm)","Penyegel yang mencegah pertukaran molekul antar sel","Pelekat mekanis yang diperantarai kadherin","Struktur yang mempertahankan bentuk membran basal","Penerima rangsangan cahaya"],w:["Penyegel yang mencegah pertukaran molekul adalah fungsi tight junction (zonula occludens), bukan gap junction.","Pelekat mekanis yang diperantarai kadherin adalah fungsi zonula adherens.","Struktur membran basal dibentuk oleh lamina basalis dan lamina fibroreticularis, bukan gap junction.","Penerimaan cahaya bukan fungsi gap junction; struktur ini berperan pada komunikasi sel."],e:"Gap junction menghubungkan dua sel melalui konektor (connexon) yang dibentuk oleh connexin. Kanal ini memungkinkan pertukaran molekul kecil dengan diameter kurang dari 1,5 nm. Pada jantung dan otot viseral, gap junction membantu kontraksi ritmis."},
{t:"C1-C2",s:"Ciri khas sel otot rangka yang membedakannya dari otot jantung dan otot polos adalah...",o:["Sel panjang, multinukleus, dengan inti oval di tepi sel di bawah sarkolema","Sel fusiform dengan satu inti di tengah","Sel bercabang dengan diskus interkalatus","Sel spindel tanpa lurik dengan kontraksi spontan","Sel dengan satu inti di tengah dan lurik yang tidak teratur"],w:["Sel fusiform dengan satu inti di tengah adalah ciri otot polos.","Sel bercabang dengan diskus interkalatus adalah ciri otot jantung.","Sel spindel tanpa lurik adalah ciri otot polos, bukan otot rangka.","Lurik yang tidak teratur dan satu inti di tengah adalah ciri otot jantung, bukan otot rangka."],e:"Serat otot rangka berbentuk silindris panjang (10-100 µm) dan multinukleus akibat fusi mioblas embrional. Inti berbentuk oval berada di tepi sel di bawah sarkolema. Lurik yang jelas dan kontraksi volunter menjadi ciri lain yang membedakannya."},
{t:"C1-C2",s:"Diskus interkalatus merupakan struktur khas yang hanya ditemukan pada...",o:["Otot jantung","Otot rangka","Otot polos","Otot polos tipe multiunit","Membrana basalis epitel"],w:["Otot rangka tidak memiliki diskus interkalatus; sel-selnya terpisah dan membentuk serat multinukleus.","Otot polos tidak memiliki diskus interkalatus; sel-selnya dihubungkan oleh gap junction pada tipe visceral.","Otot polos tipe multiunit tidak memiliki diskus interkalatus; sel-selnya berdiri sendiri dan dipersarafi satu persatu.","Membrana basalis adalah lapisan ekstraseluler, bukan jenis otot."],e:"Diskus interkalatus adalah batas antar sel yang berdekatan pada otot jantung. Struktur ini mengandung desmosoma dan gap junction, yang memungkinkan kontraksi dan penghantaran impuls secara terkoordinasi. Diskus ini hanya terdapat pada otot jantung."},
{t:"C1-C2",s:"Sel otot polos berbentuk fusiform dengan satu inti di tengah dan tidak memiliki lurik. Kontraksinya bersifat...",o:["Involunter, lambat, dan dikendalikan sistem saraf otonom","Volunter dan cepat","Involunter tetapi selalu cepat dan kuat","Volunter dengan lurik yang teratur","Tidak dapat berkontraksi tanpa rangsangan sadar"],w:["Kontraksi volunter dan cepat adalah ciri otot rangka.","Kontraksi involunter yang selalu cepat dan kuat adalah ciri otot jantung, bukan otot polos.","Lurik yang teratur dan kontraksi volunter adalah ciri otot rangka.","Otot polos berkontraksi tanpa kesadaran dan bahkan dapat berkontraksi spontan, sehingga pernyataan ini tidak tepat."],e:"Otot polos terdiri dari sel fusiform dengan satu inti di tengah, tidak memiliki lurik, dan dipersarafi sistem saraf otonom. Kontraksinya lambat, lama, dan involunter. Otot polos juga disebut otot visceral."},
{t:"C1-C2",s:"Lapisan jaringan ikat yang membungkus setiap serat otot rangka disebut...",o:["Endomisium","Epimisium","Perimisium","Sarkolema","Sarkoplasma"],w:["Epimisium membungkus seluruh otot, bukan satu serat otot.","Perimisium membungkus berkas serat otot yang disebut fasikulus, bukan serat individual.","Sarkolema adalah membran sel serat otot itu sendiri, bukan jaringan ikat pembungkus.","Sarkoplasma adalah sitoplasma sel otot, bukan jaringan ikat."],e:"Epimisium membungkus seluruh otot, perimisium membungkus fasikulus, dan endomisium membungkus setiap serat otot. Jaringan ikat ini meneruskan gaya mekanis dari serat yang berkontraksi ke seluruh otot."},
{t:"C1-C2",s:"Pada otot rangka, pita yang lebih terang dan hanya mengandung filamen aktin disebut...",o:["Pita I","Pita A","Zona H","Garis M","Garis Z"],w:["Pita A adalah pita yang lebih gelap dan mengandung filamen miosin.","Zona H adalah bagian terang di tengah pita A yang hanya mengandung miosin.","Garis M adalah garis tempat perlekatan filamen miosin, bukan pita yang mengandung aktin.","Garis Z adalah batas sarkomer tempat perlekatan filamen aktin, bukan pita."],e:"Pita I adalah pita terang yang hanya berisi filamen aktin. Pita ini dibagi dua oleh garis Z. Pita A berisi miosin, zona H berisi miosin saja di tengah pita A, garis M menahan miosin, dan garis Z menahan aktin."},
{t:"C1-C2",s:"Sel satelit pada otot rangka berfungsi sebagai...",o:["Mioblas yang tetap inaktif dan dapat meregenerasi serat otot setelah kerusakan","Sel darah yang mengangkut oksigen ke serat otot","Sel saraf yang mengatur kontraksi","Sel lemak yang menyimpan energi","Sel endotel pembentuk kapiler"],w:["Sel darah tidak berperan dalam regenerasi serat otot rangka.","Sel saraf motorik mengendalikan kontraksi, bukan regenerasi serat otot.","Sel lemak tidak berperan dalam regenerasi serat otot rangka.","Sel endotel membentuk kapiler, tidak berperan langsung dalam regenerasi serat otot."],e:"Sel satelit adalah mioblas yang tetap ada dan inaktif, dan berfungsi meregenerasi serat otot setelah trauma. Kemampuan regenerasi otot rangka terbatas, sehingga peran sel satelit sangat penting."},
{t:"C3-C4",s:"Hasil biopsi kulit telapak tangan menunjukkan epitel berlapis dengan lapisan permukaan yang mengalami penandukan dan tanpa nukleus. Jenis epitel yang paling tepat adalah...",o:["Stratificatum squamosum cornificatum","Stratificatum squamosum noncornificatum","Simplex squamosum","Pseudostratificatum columnare","Transitionale"],w:["Stratificatum squamosum noncornificatum tidak memiliki lapisan tanduk; permukaannya tetap memiliki nukleus.","Simplex squamosum hanya selapis dan biasanya ditemukan pada glomerulus ginjal, bukan kulit telapak.","Pseudostratificatum columnare memiliki sel silindris dan silia, bukan lapisan tanduk.","Transitionale ditemukan pada vesica urinaria dan tidak memiliki lapisan tanduk."],e:"Kulit telapak termasuk stratificatum squamosum cornificatum. Lapisan permukaannya mengalami penandukan (keratinisasi) dan kehilangan nukleus, sehingga mencegah dehidrasi. Tipe ini berbeda dari noncornificatum yang ditemukan pada esofagus dan rongga basah."},
{t:"C3-C4",s:"Wanita 45 tahun dengan urin hipertonik dan kandung kemih yang terus-menerus mengisi dan mengosongkan. Histologi vesica urinaria menunjukkan epitel dengan sel berbentuk membulat saat organ mengempis dan menipis saat mengembang. Jenis epitel ini adalah...",o:["Transitionale, dengan sel yang dapat berubah bentuk sesuai peregangan organ","Stratificatum squamosum cornificatum","Simplex columnare dengan silia","Pseudostratificatum columnare","Simplex cuboideum"],w:["Stratificatum squamosum cornificatum memiliki lapisan tanduk yang tidak dapat berubah bentuk sesuai peregangan.","Simplex columnare adalah selapis dengan sel silindris, tidak dapat menyesuaikan bentuk sebesar epitel transisi.","Pseudostratificatum columnare ditemukan di saluran napas atas, bukan kandung kemih.","Simplex cuboideum ditemukan pada glandula thyroidea, bukan vesica urinaria."],e:"Epitel transitionale melindungi jaringan di bawahnya dari urin yang hipertonik dan berpotensi sitotoksik. Bentuk selnya dapat berubah sesuai peregangan organ, membulat saat kandung kemih mengempis dan menipis saat mengembang."},
{t:"C3-C4",s:"Pasien perokok dengan batuk berdahak kronis. Biopsi saluran napas menunjukkan epitel pseudostratificatum columnare dengan silia yang sedikit dan tidak bergerak teratur. Dampak paling mungkin dari gangguan silia ini adalah...",o:["Penumpukan sekret dan gangguan pembersihan saluran napas","Peningkatan absorpsi nutrisi di saluran napas","Peningkatan sekresi hormon tiroid","Pengurangan luas permukaan saluran napas","Pengaktifan sel satelit untuk regenerasi"],w:["Absorpsi nutrisi adalah fungsi mikrovili usus, bukan silia saluran napas.","Sekresi hormon tiroid tidak berkaitan dengan fungsi silia saluran napas.","Silia tidak mengurangi luas permukaan; masalahnya adalah pembersihan sekret.","Sel satelit berperan pada otot rangka, bukan pada epitel saluran napas."],e:"Silia pada epitel saluran napas bergerak secara ritmis dan mendorong lapisan lendir serta partikel ke arah faring. Gangguan silia menyebabkan penumpukan sekret, infeksi berulang, dan batuk kronis. Silia berbeda dari mikrovili yang berfungsi untuk absorpsi."},
{t:"C3-C4",s:"Pasien dengan malabsorpsi kronis menjalani biopsi usus halus. Mikroskop menunjukkan vili yang mendatar dan brush border yang hilang. Struktur yang paling berhubungan dengan gangguan absorpsi ini adalah...",o:["Mikrovili yang membentuk brush border, yang berfungsi memperluas permukaan absorpsi","Silia yang menggerakkan cairan dalam lumen","Gap junction yang menghubungkan sel epitel","Zonula occludens yang menyegel sel epitel","Stereosilia yang mendeteksi getaran"],w:["Silia yang menggerakkan cairan berada pada saluran napas, bukan usus halus.","Gap junction berfungsi komunikasi antar sel, bukan absorpsi.","Zonula occludens menyegel sel tetapi bukan struktur utama absorpsi.","Stereosilia berada pada epididimis dan sel sensorik telinga dalam, bukan usus halus."],e:"Brush border terdiri atas mikrovili padat yang memperluas permukaan absorpsi. Hilangnya brush border dan mendatarnya vili menurunkan luas permukaan absorpsi, sehingga menyebabkan malabsorpsi. Hal ini sering terjadi pada penyakit seperti seliak."},
{t:"C3-C4",s:"Pada epididimis, sel epitel memiliki stereosilia. Fungsi utama stereosilia di sini adalah...",o:["Memperluas permukaan absorpsi sel epitel","Menggerakkan sperma secara aktif","Mensekresi hormon testosteron","Menghasilkan lapisan tanduk pelindung","Membentuk tight junction antar sel"],w:["Menggerakkan sperma secara aktif bukan fungsi stereosilia; sperma bergerak dengan flagelnya sendiri.","Sekresi testosteron dilakukan oleh sel Leydig, bukan epitel epididimis.","Lapisan tanduk adalah ciri epitel stratificatum squamosum cornificatum, bukan epididimis.","Tight junction dibentuk oleh claudin dan occludin, bukan oleh stereosilia."],e:"Stereosilia adalah tonjolan apikal panjang yang khas pada sel absorptif epididimis dan bagian proksimal ductus deferens. Seperti mikrovili, stereosilia memperluas permukaan sel untuk absorpsi, sehingga membantu pematangan dan pemekatan cairan yang membawa sperma."},
{t:"C3-C4",s:"Pasien dengan jerawat berulang. Biopsi kelenjar sebasea menunjukkan seluruh sel kelenjar hancur dan dilepaskan bersama sekret sebum. Mekanisme sekresi yang paling tepat adalah...",o:["Holokrin","Merokrin","Apokrin","Endokrin","Eksositosis tanpa kehilangan sitoplasma"],w:["Merokrin adalah eksositosis tanpa kehilangan sel; vesikel mengeluarkan sekret tanpa menghancurkan sel.","Apokrin adalah hilangnya sebagian sitoplasma apikal, bukan seluruh sel.","Endokrin melepaskan hormon ke aliran darah, bukan sebum ke permukaan kulit.","Eksositosis tanpa kehilangan sitoplasma adalah deskripsi merokrin, bukan holokrin."],e:"Sekresi holokrin ditandai dengan hancurnya seluruh sel kelenjar yang lalu dilepaskan bersama sekret. Mekanisme ini hanya ditemukan pada kelenjar sebasea kulit, sehingga sebum terbentuk dari sel yang hancur."},
{t:"C3-C4",s:"Pada kelenjar mamae, sebagian sitoplasma apikal sel ikut terlepas bersama sekret susu. Mekanisme sekresi yang terjadi adalah...",o:["Apokrin","Holokrin","Merokrin","Endokrin","Eksositosis murni"],w:["Holokrin adalah hancurnya seluruh sel, bukan hilangnya sebagian sitoplasma.","Merokrin adalah eksositosis tanpa kehilangan sitoplasma sel.","Endokrin melepaskan hormon ke pembuluh darah, bukan susu ke saluran duktus.","Eksositosis murni tidak menyebabkan hilangnya sebagian sitoplasma apikal."],e:"Mekanisme apokrin ditandai hilangnya sebagian sitoplasma apikal sel bersama sekret. Kelenjar mamae, kelenjar keringat apokrin, dan prostat menggunakan mekanisme ini."},
{t:"C3-C4",s:"Kelenjar tiroid mensekresi hormon dengan mekanisme endokrin. Hormon tersebut dilepaskan ke...",o:["Ruang ekstraseluler dan kemudian ke kapiler darah","Duktus yang bermuara ke permukaan kulit","Rongga alat pencernaan melalui lumen","Pembuluh limfa yang menuju kelenjar getah bening saja","Permukaan folikel tanpa perantara"],w:["Duktus yang bermuara ke kulit adalah ciri kelenjar eksokrin, bukan endokrin.","Rongga alat pencernaan melalui lumen adalah ciri kelenjar eksokrin.","Pembuluh limfa saja tidak tepat, karena hormon endokrin utama masuk ke aliran darah.","Permukaan folikel tanpa perantara tidak menjelaskan mekanisme pelepasan yang benar."],e:"Kelenjar endokrin melepaskan hormon ke ruang ekstraseluler, lalu masuk ke aliran darah atau limfa. Pada kelenjar tiroid, folikel mengelilingi koloid, dan hormon dilepaskan ke kapiler sekitar folikel."},
{t:"C3-C4",s:"Biopsi otot pada pasien dengan kelemahan proksimal menunjukkan serat multinukleus, lurik melintang yang jelas, dan inti oval di tepi sel. Diagnosis jaringan yang paling tepat adalah...",o:["Otot rangka (jaringan otot lurik) dengan kontraksi volunter","Otot jantung dengan diskus interkalatus","Otot polos dengan kontraksi involunter","Jaringan ikat padat dengan serat kolagen","Jaringan epitel stratificatum squamosum"],w:["Otot jantung memiliki inti di tengah, sel bercabang, dan diskus interkalatus, sehingga tidak sesuai dengan inti di tepi.","Otot polos tidak memiliki lurik melintang dan tidak multinukleus.","Jaringan ikat padat tidak memiliki serat otot dengan lurik dan multinukleus.","Epitel stratificatum squamosum tidak memiliki lurik melintang dan termasuk jaringan epitel."],e:"Serat multinukleus dengan lurik melintang dan inti oval di tepi sel khas otot rangka. Kontraksinya cepat dan kuat serta di bawah kendali sadar. Gambaran ini membantu membedakannya dari otot jantung dan otot polos."},
{t:"C3-C4",s:"Pasien pasca infark miokard mengalami kerusakan pada otot jantung. Pemulihan jaringan jantung pada kondisi ini paling mungkin berupa...",o:["Jaringan parut (skar) akibat proliferasi jaringan ikat, karena otot jantung praktis tidak dapat beregenerasi","Regenerasi total sel otot jantung dari sel satelit","Mitosis sel otot jantung yang sangat aktif","Regenerasi dari sel otot polos pembuluh darah","Pembentukan serat otot rangka baru di lokasi infark"],w:["Regenerasi total dari sel satelit tidak sesuai, karena sel satelit pada otot jantung sangat sedikit dan tidak efektif.","Mitosis sel otot jantung tidak aktif; sel ini praktis tidak dapat membelah setelah masa kanak-kanak.","Sel otot polos pembuluh darah dapat berproliferasi, tetapi tidak menggantikan kardiomiosit dalam jumlah yang sama dengan regenerasi.","Serat otot rangka tidak terbentuk di jantung; jaringan otot jantung dan otot rangka memiliki asal dan kemampuan regenerasi yang berbeda."],e:"Otot jantung praktis tidak mampu beregenerasi setelah masa kanak-kanak. Trauma seperti infark memicu proliferasi jaringan ikat, sehingga kerusakan digantikan oleh skar. Hal ini menjelaskan mengapa kerusakan miokard memengaruhi fungsi jantung secara permanen."},
{t:"C3-C4",s:"Otot polos tipe visceral di dinding usus dapat berkontraksi secara spontan ketika teregang. Mekanisme yang paling menjelaskan hal ini adalah...",o:["Berkas sel otot yang dihubungkan oleh gap junction, sehingga impuls menyebar antar sel","Sel otot polos yang dipersarafi satu nervus terminalis","Sel otot rangka yang berada di dinding usus","Sel otot jantung yang membentuk diskus interkalatus","Sel satelit yang aktif berkontraksi"],w:["Sel otot polos tipe multiunit dipersarafi satu nervus terminalis dan tidak berkontraksi spontan.","Sel otot rangka berada di otot volunter, bukan di dinding usus.","Diskus interkalatus adalah struktur otot jantung, bukan otot polos usus.","Sel satelit berperan dalam regenerasi, bukan kontraksi spontan."],e:"Otot polos tipe visceral membentuk berkas sel yang dihubungkan oleh gap junction. Akibatnya impuls dapat menyebar dan menimbulkan kontraksi spontan jika teregang melebihi batas tertentu. Contohnya otot polos dinding usus. Berbeda dengan tipe multiunit yang tidak berkontraksi spontan."},
{t:"C3-C4",s:"Pelari maraton memiliki serat otot yang dominan tahan lama dan sangat banyak mitokondria serta mioglobin. Tipe serat otot ini adalah...",o:["Serat lambat (merah), aerobik, dengan diameter lebih kecil","Serat cepat (putih), glikolitik anaerob, dengan diameter besar","Serat menengah dengan glikolisis dominan","Serat otot jantung dengan diskus interkalatus","Serat otot polos dengan kontraksi involunter"],w:["Serat cepat (putih) bersifat glikolitik dan mudah lelah, sehingga tidak sesuai dengan daya tahan pelari maraton.","Serat menengah berada di antara keduanya dan tidak menjadi tipe dominan pada pelari maraton ini.","Otot jantung memiliki diskus interkalatus; tidak dibahas sebagai serat otot rangka pada kasus ini.","Otot polos tidak memiliki mitokondria dan mioglobin sebanyak serat merah, serta tidak berkontraksi volunter."],e:"Serat lambat (merah) berukuran sekitar setengah serat cepat, kontraksinya lebih lambat tetapi dapat berlangsung lama. Serat ini aerobik, kaya mitokondria, dan mengandung mioglobin. Pelari maraton memiliki dominasi serat tipe ini."},
{t:"C3-C4",s:"Pada atlet angkat beban, otot bertambah besar tanpa penambahan jumlah serat otot. Proses ini secara histologis paling tepat disebut...",o:["Hipertrofi, yaitu peningkatan diameter serat karena peningkatan miofibril","Hiperplasia, yaitu peningkatan jumlah serat otot","Regenerasi, yaitu pembentukan serat baru dari sel satelit","Atrofi, yaitu penurunan massa otot","Metaplasia, yaitu perubahan jenis serat otot"],w:["Hiperplasia adalah peningkatan jumlah sel; pada otot rangka jumlah serat tidak bertambah pada kasus ini.","Regenerasi adalah pembentukan serat baru setelah kerusakan; pada latihan beban tidak terjadi kerusakan yang memicu regenerasi.","Atrofi adalah hilangnya tonus dan massa otot akibat kurangnya stimulasi, bukan peningkatan massa.","Metaplasia adalah perubahan tipe sel, bukan peningkatan diameter serat pada latihan beban."],e:"Latihan beban meningkatkan diameter serat melalui peningkatan mitokondria, aktin dan miosin, serta miofibril. Jumlah serat tidak bertambah, sehingga disebut hipertrofi. Secara umum, peningkatan ukuran disebut hipertrofi dan peningkatan jumlah sel disebut hiperplasia."},
{t:"C3-C4",s:"Gerakan jari yang sangat halus, misalnya otot kecil di tangan, dikendalikan oleh unit motorik yang memiliki...",o:["Jumlah serat otot yang sedikit per unit motorik","Ratusan serat otot per unit motorik","Satu serat otot per neuron motorik saja","Serat otot jantung yang terhubung dengan diskus interkalatus","Serat otot polos yang dipersarafi sistem otonom"],w:["Ratusan serat per unit motorik memberi gerakan kasar dan kuat, bukan halus.","Satu serat per neuron tidak mencerminkan unit motorik yang biasanya mencakup banyak serat.","Serat otot jantung tidak memiliki unit motorik dan tidak dikendalikan secara volunter.","Serat otot polos dipersarafi sistem otonom dan tidak memberi gerakan halus volunter."],e:"Unit motorik adalah satu neuron motorik beserta semua serat otot yang dipersarafinya. Rata-rata sekitar 150 serat per unit. Semakin halus gerakannya, semakin sedikit serat per unit motorik, sehingga kontrol gerakan menjadi lebih presisi."},
{t:"C3-C4",s:"Pada kontraksi otot rangka, ketika sarkomer memendek, perubahan yang terjadi pada pita dan garis adalah...",o:["Garis Z saling mendekat; pita I dan zona H mengecil, sedangkan pita A tetap panjangnya","Pita A memanjang, pita I tetap","Garis M menjauh dari garis Z","Pita I membesar dan zona H melebar","Filamen miosin memendek sendiri tanpa interaksi dengan aktin"],w:["Pita A memanjang dan pita I tetap tidak sesuai model filamen geser, karena pita A tetap panjangnya.","Garis M menjauh dari garis Z tidak sesuai dengan model filamen geser; garis M tetap sebagai pusat miosin.","Pita I membesar dan zona H melebar bertentangan dengan model kontraksi, karena keduanya mengecil.","Miosin tidak memendek sendiri; kontraksi terjadi akibat interaksi jembatan silang antara miosin dan aktin."],e:"Kontraksi terjadi melalui model filamen geser. Aktin ditarik ke arah tengah sarkomer oleh jembatan silang miosin, sehingga garis Z saling mendekat, pita I dan zona H mengecil, sedangkan pita A tetap panjangnya karena panjang filamen miosin tidak berubah."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>
